<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stillblade</title>
    <!-- Icons: drawn in public/favicon.svg, rendered by tools/make-icons.mjs. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#172029">
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d10; color: #e8eaed;
            font: 13px/1.4 ui-monospace, Consolas, monospace; }
        #game { display: block; width: 100%; height: 100%; outline: none; }
        #hud { position: fixed; top: 8px; right: 12px; text-align: right; white-space: pre; pointer-events: none;
            text-shadow: 0 1px 2px #000; margin-top: 150px; }
        #crosshair { position: fixed; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px;
            background: #e8eaed; border-radius: 50%; pointer-events: none; }
    </style>
</head>
<body class="no-stats">
    <canvas id="game" tabindex="0"></canvas>
    <div id="crosshair"></div>
    <div id="hud"></div>
    <script type="module" src="/src/entry.ts"></script>
</body>
</html>
