name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      # Map files are committed, so Blender is never needed here.
      - name: Build client
        run: npm run build:client

      - name: Build server
        run: npm run build:server

      - name: Smoke test the production container
        run: |
          docker build --build-arg SB_COMMIT="$GITHUB_SHA" -t stillblade-ci .
          docker run -d --name stillblade-ci -p 127.0.0.1:18080:8080 \
            -e SB_ALLOWED_ORIGINS=http://localhost:5173 stillblade-ci
          trap 'docker logs stillblade-ci; docker rm -f stillblade-ci >/dev/null' EXIT
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:18080/health
          node tools/release-smoke.mjs http://127.0.0.1:18080 http://localhost:5173
